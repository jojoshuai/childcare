server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 反代 /api 到云托管 server 内网域名
    location /api/ {
        proxy_pass http://caawkcij.childcare.ccwxy1gg.8utosasx.com/api/;
        proxy_set_header Host caawkcij.childcare.ccwxy1gg.8utosasx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router history 模式：所有路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（Vite 生成带 hash 的文件名）
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查（云托管探针用）
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
